FINAL INTERVIEW QUESTION
Your interviewer says:

“Our stateful production application suddenly became unavailable. How would you troubleshoot it?”

Answer:

“First I would clarify the scope of the incident and determine what changed around the time of failure. I would check the workload state and then use describe, logs and events to collect evidence. I would verify the application's dependencies, including Services, endpoints, DNS, ports, StatefulSet replicas, PVC/PV status and storage. If the environment uses GitOps, I would also compare the Git desired state with the live cluster and review the latest Argo CD synchronization. After identifying the root cause, I would apply or revert the appropriate change through the normal deployment process and verify both service availability and data integrity.”

Commands Students Should Know After This Lab
kubectl get pods -n production -o wide

kubectl describe pod <pod> -n production

kubectl logs <pod> -n production

kubectl logs <pod> -n production --previous

kubectl get events \
  -n production \
  --sort-by=.lastTimestamp

kubectl get sts -n production

kubectl get svc -n production

kubectl describe svc <service> -n production

kubectl get endpoints -n production

kubectl get endpointslices -n production

kubectl get pods -n production --show-labels

kubectl get pvc -n production

kubectl describe pvc <pvc> -n production

kubectl get pv

kubectl get sc
The Rule to Remember
                 PRODUCTION DOWN
                        |
                        v
                  WHAT CHANGED?
                        |
                        v
                       GET
                        |
                        v
                    DESCRIBE
                        |
                        v
                      LOGS
                        |
                        v
                     EVENTS
                        |
                        v
                  DEPENDENCIES
                        |
        +---------------+---------------+
        |               |               |
        v               v               v
     NETWORK          STORAGE          CONFIG
        |               |               |
     Service           PVC           Secret
     Endpoint           PV            ConfigMap
     DNS                SC
     Port               CSI
        |               |
        +-------+-------+
                |
                v
            ROOT CAUSE
                |
                v
               FIX
                |
                v
             VERIFY
Do not restart first. Investigate first.

How I would run the three hours
First 30–40 minutes: build the MySQL StatefulSet, create real database data, delete mysql-0, and prove persistence.

Next 60 minutes: Service selector → endpoints → DNS → wrong targetPort → readiness → ImagePullBackOff. Make the students tell you which command to run before you run it.

10-minute break.

Next 35–40 minutes: PVC Pending + CrashLoopBackOff + storage troubleshooting.

Final 30–40 minutes: turn on Argo CD ownership, demonstrate drift, then finish with the bad Git release causing a production outage. Make the students diagnose and recover it themselves.

One important production distinction to say during class: a StatefulSet gives each Pod stable identity and can associate it with stable storage, but that alone does not give MySQL database replication or high availability. This lab deliberately uses one MySQL replica so students don't leave believing that replicas: 3 automatically creates a valid MySQL HA cluster. Kubernetes documents StatefulSet's stable network/storage identity behavior explicitly. :chatgpt-content-reference{index="5"}

