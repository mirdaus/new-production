Git = 1 replica

Cluster = 2 replicas
Problem:

Configuration Drift
Argo CD:

reconciles desired state
Incident 8
Production was working

Git change

Argo CD sync

Production down
Investigation:

What changed?
    ↓
Pods
    ↓
Describe
    ↓
Events
    ↓
